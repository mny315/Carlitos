pluginManagement {
    def versions = new groovy.json.JsonSlurper().parse(file('../nix/android-versions.json'))
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version versions.agp
        id 'org.jetbrains.kotlin.android' version versions.kotlin
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'Carlitos'
include ':app'
include ':fixtures'
